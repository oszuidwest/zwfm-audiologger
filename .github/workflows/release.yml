---
# Thin shim — delegates to oszuidwest/.github-templates go-release.yml@v2.
# Docker publishing is composed via a second job that calls
# docker-publish.yml@v2 directly, gated on the release outputs.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (edge or vX.Y.Z)'
        required: true
        default: 'edge'

permissions:
  contents: read

jobs:
  release:
    uses: oszuidwest/.github-templates/.github/workflows/go-release.yml@v2
    with:
      project-name: audiologger
      ldflags-target: main
      build-matrix: >-
        [{"os":"linux","arch":"amd64"},
         {"os":"linux","arch":"arm64"},
         {"os":"linux","arch":"arm","arm":"7"},
         {"os":"darwin","arch":"amd64"},
         {"os":"darwin","arch":"arm64"}]
      version: ${{ inputs.version }}
    permissions:
      contents: write

  docker:
    needs: release
    if: needs.release.outputs.is_release == 'true'
    uses: oszuidwest/.github-templates/.github/workflows/docker-publish.yml@v2
    with:
      version: ${{ needs.release.outputs.version }}
      image-labels: |
        org.opencontainers.image.title=ZuidWest FM Audio Logger
        org.opencontainers.image.description=Hourly broadcast recorder
        org.opencontainers.image.vendor=Streekomroep ZuidWest
        org.opencontainers.image.licenses=MIT
    permissions:
      contents: read
      packages: write
